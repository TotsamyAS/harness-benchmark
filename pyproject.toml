[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "confidential-harness-benchmark"
version = "0.1.0"
description = "Reproducible corporate agent benchmark with human-reviewed privacy evaluation"
requires-python = ">=3.11"
dependencies = ["openai>=1.60,<3", "python-dotenv>=1,<2", "openpyxl>=3.1,<4", "python-docx>=1.2,<2", "python-pptx>=1,<2", "pypdf>=5,<7", "reportlab>=4,<5", "pandas>=2.2,<4", "matplotlib>=3.9,<4", "nbformat>=5.10,<6", "ipykernel>=6,<8", "httpx>=0.28,<1", "cryptography>=44,<51"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbclient>=0.10,<1", "pymupdf>=1.25,<2"]

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
addopts = "--basetemp=.tmp/pytest"
cache_dir = ".tmp/pytest-cache"
